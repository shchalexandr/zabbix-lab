---
- name: Deploy Zabbix Agent on VM1
  hosts: zabbix_agents
  become: true
  vars:
    zabbix_agent_version_check: false
    zabbix_agent_version: "7.4"
  roles:
    - role: community.zabbix.zabbix_agent
      vars:
        zabbix_agent_server: "{{ zabbix_server_ip }}"
        zabbix_agent_serveractive: "{{ zabbix_server_ip }}"
