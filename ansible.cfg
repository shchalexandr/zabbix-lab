[defaults]
inventory = inventory/hosts.yml
remote_user = ansible
private_key_file = ~/.ssh/id_ed25519
host_key_checking = False   # только для лабы, в проде — обязательно True

# не поставился postgresql сервер, не создался пользователь postgres, соответственно не меняются права на временные файлы
[connection]
pipelining = True
# или в инвентаре ansible_pipelining: true
